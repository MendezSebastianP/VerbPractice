<!DOCTYPE html>
<html lang="en" data-theme="{{ theme if theme else 'light' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>LexArena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&family=Schibsted+Grotesk:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  {% if spa_css %}<link rel="stylesheet" href="/static/spa/{{ spa_css }}">{% endif %}
</head>
<body>
  <div id="app"></div>
  <script>
    window.__LEXARENA_BOOT__ = {
      csrfToken: {{ csrf_token|tojson }},
      initialTheme: {{ theme|tojson }},
      spaPath: {{ spa_path|tojson }}
    };
  </script>
  <script type="module" src="/static/spa/{{ spa_js }}"></script>
</body>
</html>
