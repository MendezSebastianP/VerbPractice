<!DOCTYPE html>
<html lang="en" data-theme="{{ theme if theme else 'light' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}LexArena{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app-body">
  <div class="shell-glow" aria-hidden="true"></div>
  <header class="topbar">
    <div class="container nav-wrap">
      <a
        class="brand-lockup"
        href="/"
        hx-get="/"
        hx-target="#page-content"
        hx-select="#page-content"
        hx-swap="outerHTML transition:true show:none"
        hx-push-url="true"
      >
        <span class="brand-mark">LexArena</span>
        <span class="brand-sub">Adaptive language training</span>
      </a>

      <nav
        class="menu"
        aria-label="Primary"
        hx-boost="true"
        hx-target="#page-content"
        hx-select="#page-content"
        hx-swap="outerHTML transition:true show:none"
        hx-push-url="true"
      >
        <a href="/" class="{% if active_path == '/' %}is-active{% endif %}">Dashboard</a>
        <a href="/training/words" class="{% if active_path.startswith('/training/words') %}is-active{% endif %}">Words</a>
        <a href="/training/verbs" class="{% if active_path.startswith('/training/verbs') %}is-active{% endif %}">Verbs</a>
        <a href="/training/conjugation" class="{% if active_path.startswith('/training/conjugation') %}is-active{% endif %}">Conjugation</a>
        <a href="/chat" class="{% if active_path.startswith('/chat') %}is-active{% endif %}">AI Tutor</a>
      </nav>

      <div class="nav-actions" x-data="themeSwitcher()" x-init="init()">
        <div class="theme-toggle" role="group" aria-label="Theme switcher">
          <button type="button" @click="set('light')" :class="{ 'active': current==='light' }">Light</button>
          <button type="button" @click="set('dark')" :class="{ 'active': current==='dark' }">Dark</button>
          <button type="button" @click="set('arcade')" :class="{ 'active': current==='arcade' }">Arcade</button>
        </div>

        {% if current_user %}
          <div class="profile-pill">
            <div>
              <p class="profile-name">{{ current_user.username }}</p>
              <p class="profile-meta">Lv.{{ profile.level if profile else 1 }} · {{ profile.streak_days if profile else 0 }} day streak</p>
            </div>
          </div>
          <form method="post" action="/auth/logout" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="btn ghost" type="submit">Logout</button>
          </form>
        {% endif %}
      </div>
    </div>
  </header>

  <main
    id="page-content"
    class="container page-shell"
    hx-boost="true"
    hx-target="#page-content"
    hx-select="#page-content"
    hx-swap="outerHTML transition:true show:none"
    hx-push-url="true"
  >
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
